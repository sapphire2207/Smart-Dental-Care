<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Outer Gold/Bronze Metallic Crescent Orbit (Right & Encircling) -->
  <path
    d="M 100 15 
       C 152 15 190 53 190 100 
       C 190 147 152 185 100 185 
       C 142 170 170 138 170 100 
       C 170 62 142 30 100 15 Z"
    fill="#C59B27"
  />

  <!-- Inner White Crescent Orbit (Left Arc) -->
  <path
    d="M 135 32 
       C 75 32 30 62 30 100 
       C 30 138 75 168 135 168 
       C 62 165 15 135 15 100 
       C 15 65 62 35 135 32 Z"
    fill="#FFFFFF"
  />

  <!-- Perfectly Shaped Molar Tooth in Center -->
  <path
    d="M 100 70 
       C 92 70 85 73 78 77 
       C 70 82 70 95 72 110 
       C 74 125 78 138 82 148 
       C 85 155 92 155 94 148 
       C 97 138 98 128 100 128 
       C 102 128 103 138 106 148 
       C 108 155 115 155 118 148 
       C 122 138 126 125 128 110 
       C 130 95 130 82 122 77 
       C 115 73 108 70 100 70 Z"
    fill="#FFFFFF"
  />

  <!-- Triple-Ribbon S-Curve Sweeping Across Tooth -->
  <!-- 1. Red Outer Ribbon Line -->
  <path
    d="M 68 90 C 70 65 95 95 100 105 C 105 115 130 145 138 122"
    stroke="#E11D48"
    stroke-width="5"
    stroke-linecap="round"
  />
  <!-- 2. White Center Ribbon Line -->
  <path
    d="M 72 94 C 74 71 97 99 100 108 C 103 117 127 146 135 125"
    stroke="#FFFFFF"
    stroke-width="3"
    stroke-linecap="round"
  />
  <!-- 3. Royal Blue Inner Ribbon Line -->
  <path
    d="M 76 98 C 78 77 99 103 100 111 C 101 119 124 147 132 128"
    stroke="#2563EB"
    stroke-width="4.5"
    stroke-linecap="round"
  />
</svg>
